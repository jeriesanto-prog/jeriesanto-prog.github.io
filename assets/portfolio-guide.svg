<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title description">
  <title id="title">Build and publish the portfolio</title>
  <desc id="description">Edit one index.html file, open it in a browser, then publish the repository with GitHub Pages.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f0edff"/>
      <stop offset="1" stop-color="#faf9ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 8 5 1 9" fill="none" stroke="#7668e8" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
    </marker>
  </defs>
  <rect width="960" height="300" rx="24" fill="url(#background)"/>
  <text x="44" y="58" fill="#26243c" font-family="system-ui, sans-serif" font-size="21" font-weight="700">A tiny site, from edit to live</text>
  <text x="44" y="84" fill="#77758c" font-family="system-ui, sans-serif" font-size="14">No build tools or dependencies needed.</text>
  <g font-family="system-ui, sans-serif">
    <rect x="44" y="118" width="248" height="124" rx="17" fill="#fff" stroke="#e4e0fa"/>
    <circle cx="76" cy="152" r="17" fill="#eeebff"/>
    <text x="76" y="158" fill="#6554d8" font-size="16" font-weight="700" text-anchor="middle">1</text>
    <text x="104" y="157" fill="#26243c" font-size="16" font-weight="700">Edit index.html</text>
    <text x="68" y="194" fill="#77758c" font-size="13">Personalize details, colors,</text>
    <text x="68" y="215" fill="#77758c" font-size="13">and project cards.</text>

    <path d="M306 180h48" fill="none" marker-end="url(#arrow)" stroke="#7668e8" stroke-width="2"/>

    <rect x="366" y="118" width="248" height="124" rx="17" fill="#fff" stroke="#e4e0fa"/>
    <circle cx="398" cy="152" r="17" fill="#eeebff"/>
    <text x="398" y="158" fill="#6554d8" font-size="16" font-weight="700" text-anchor="middle">2</text>
    <text x="426" y="157" fill="#26243c" font-size="16" font-weight="700">Preview locally</text>
    <text x="390" y="194" fill="#77758c" font-size="13">Open the file directly in</text>
    <text x="390" y="215" fill="#77758c" font-size="13">any modern browser.</text>

    <path d="M628 180h48" fill="none" marker-end="url(#arrow)" stroke="#7668e8" stroke-width="2"/>

    <rect x="688" y="118" width="228" height="124" rx="17" fill="#fff" stroke="#e4e0fa"/>
    <circle cx="720" cy="152" r="17" fill="#eeebff"/>
    <text x="720" y="158" fill="#6554d8" font-size="16" font-weight="700" text-anchor="middle">3</text>
    <text x="748" y="157" fill="#26243c" font-size="16" font-weight="700">Publish</text>
    <text x="712" y="194" fill="#77758c" font-size="13">Push to GitHub, then turn</text>
    <text x="712" y="215" fill="#77758c" font-size="13">on GitHub Pages.</text>
  </g>
</svg>
